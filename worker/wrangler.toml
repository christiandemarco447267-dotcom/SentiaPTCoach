# Sentia pilot backend — Cloudflare Worker.
# Step-by-step deploy instructions: see README.md in this folder.
name = "sentia-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Plain (non-secret) settings. Secrets (API keys, admin token, webhook) are set with
# `npx wrangler secret put NAME` and never live in this file.
[vars]
# Comma-separated list of websites allowed to call this API (besides localhost for testing).
# The Sentia mobile apps (capacitor://localhost, https://localhost, http://localhost) are always allowed in code.
ALLOWED_ORIGINS = "https://christiandemarco447267-dotcom.github.io,https://sentiacoach.com,https://www.sentiacoach.com"
# AI coach provider: "openai" or "anthropic". Model is optional (cheap defaults are built in).
COACH_PROVIDER = "openai"
COACH_MODEL = ""
# Per-visitor and whole-site daily caps on AI coach questions (cost control).
COACH_DAILY_LIMIT_PER_IP = "30"
COACH_DAILY_LIMIT_TOTAL = "500"
# Optional: restrict /quote to these tickers (comma-separated). Empty = any well-formed US ticker.
SYMBOL_ALLOWLIST = ""
# Accounts ("Continue with Google / Apple"). Leave empty to hide that option; email + password
# and Face ID / Touch ID sign-in work without them. Setup: UPLOAD_STEPS.md / README.md → "Accounts".
GOOGLE_CLIENT_ID = ""
APPLE_SERVICES_ID = ""
APPLE_BUNDLE_ID = ""
# Account emails (verify your email, reset your password) are sent with Resend (https://resend.com).
# Also needs the RESEND_API_KEY secret:  npx wrangler secret put RESEND_API_KEY
# Without that secret, new email + password sign-ups are paused (no bypass) and /health shows
# emailVerification: false. Setup: README.md → "Email verification (Resend)".
EMAIL_FROM = "Sentia <no-reply@sentiacoach.com>"
# Where email buttons point when the request doesn't come from a known website (e.g. the phone apps).
SITE_URL = "https://sentiacoach.com"
# Optional background price alerts (Web Push): a contact for push services, e.g. "mailto:you@example.com".
# Also needs the VAPID_PRIVATE_KEY / VAPID_PUBLIC_KEY secrets and the [triggers] block below. See README.md.
# VAPID_SUBJECT = "mailto:you@example.com"

# Storage for feedback, rate-limit counters and daily usage counts.
# Create it once with:  npx wrangler kv namespace create SENTIA_KV
# then paste the id it prints below (replacing the placeholder).
[[kv_namespaces]]
binding = "SENTIA_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Optional background price alerts: un-comment to check stored alerts every 15 minutes.
# Does nothing until the VAPID keys are set (see README.md → "Background price alerts").
# [triggers]
# crons = ["*/15 * * * *"]

# Public address. Deploying attaches this hostname when the sentiacoach.com zone
# is on the same Cloudflare account (wrangler creates the DNS record).
[[routes]]
pattern = "api.sentiacoach.com"
custom_domain = true
